name: cocina_sin_tocar
description: Recetario guiado manos libres - 0488 Desarrollo de interfaces (2.º DAM).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  go_router: ^18.1.1
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  google_mlkit_pose_detection: ^0.16.1
  camera: ^0.12.1
  sensors_plus: ^7.1.1
  permission_handler: ^13.0.2
  cocina_ui:
    path: ./packages/cocina_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
